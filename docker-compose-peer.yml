services:
  node:
    build: .
    container_name: quantix-node
    restart: always
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 4G
    ports:
      - "3001:3001"
      - "6001:6001"
    environment:
      - HTTP_PORT=3001
      - P2P_PORT=6001
      - PEERS=${PEERS:-}
      # Failover mining: the watchdog toggles this to true only while
      # the master node is unreachable. NEVER run two miners at once —
      # the sync code cannot reorg divergent chains.
      - ENABLE_MINING=${ENABLE_MINING:-false}
      - SAFE_MODE=true
      - PRIVATE_KEY=node/wallet/private_key
    volumes:
      # Mount the wallet directory to persist the auto-generated private key
      - ./node/wallet:/app/node/wallet
      # Mount the data directory to persist the blockchain databse
      - ./node/data:/app/data
    networks:
      default:
      quantix-universal-net:
        # During failover, the Cloudflare tunnel replica routes
        # master.quantumresistantcoin.com -> http://quantix-master:3001
        # and the relayers use QUANTIX_NODE_URL=http://quantix-master:3001.
        # This alias makes that name resolve to THIS node on PC2.
        aliases:
          - quantix-master
          # node-explorer.quantumresistantcoin.com also resolves to this
          # node during failover so the explorer indexer keeps working
          - quantix-explorer

networks:
  # Shared with the relayer failover stack (docker-compose-failover.yml
  # in quantix-key-forge). Create once: docker network create quantix-universal-net
  quantix-universal-net:
    external: true
