version: '3.8'
services:
  master-node:
    build: .
    container_name: quantix-master
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    env_file: .env
    ports:
      - "3001:3001"
      - "6001:6001"
    volumes:
      - ./data:/app/data
      - ./node/wallet:/app/node/wallet
    networks:
      - quantix-universal-net

  explorer-node:
    build: .
    container_name: quantix-explorer
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - HTTP_PORT=3001
      - P2P_PORT=6001
      - SAFE_MODE=true
      - PEERS=ws://quantix-master:6001
    ports:
      - "3002:3001"
      - "6002:6001"
    volumes:
      - ./data-explorer:/app/data
    networks:
      - quantix-universal-net
    depends_on:
      - master-node

  standard-node:
    build: .
    container_name: quantix-standard
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - HTTP_PORT=3001
      - P2P_PORT=6001
      - SAFE_MODE=true
      - PEERS=ws://quantix-master:6001
      # Follower node only — mining while behind creates a forked chain
      # (emergency mining produced the previous-hash mismatch at 19221)
      - ENABLE_MINING=false
    ports:
      - "3003:3001"
      - "6003:6001"
    volumes:
      - ./data-standard:/app/data
      - ./node/wallet-standard:/app/node/wallet
    networks:
      - quantix-universal-net
    depends_on:
      - master-node

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quantix-tunnel
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel run
    volumes:
      - ./cloudflared/config.yaml:/etc/cloudflared/config.yaml:ro
    networks:
      - quantix-universal-net

networks:
  quantix-universal-net:
    external: true
